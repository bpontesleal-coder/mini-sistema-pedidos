<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Online · Mini sistema de pedidos</title>
  <meta name="description" content="Simulação de loja online com carrinho de compras, feita com HTML, CSS e JavaScript.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E7D32'/%3E%3Cpath d='M18 20h6l5 20h17l4-14H27' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='31' cy='47' r='3' fill='%23fff'/%3E%3Ccircle cx='44' cy='47' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topo">
    <h1>Loja Online</h1>
    <p>Escolha os produtos e acompanhe o total do pedido.</p>
  </header>

  <main class="loja">
    <section aria-labelledby="titulo-produtos">
      <h2 id="titulo-produtos">Produtos</h2>
      <div id="produtos" class="produtos"></div>
    </section>

    <aside class="carrinho" aria-labelledby="titulo-carrinho">
      <h2 id="titulo-carrinho">Carrinho <span id="contador" class="contador">0</span></h2>
      <p id="carrinho-vazio" class="vazio">Seu carrinho está vazio.</p>
      <ul id="carrinho" class="itens"></ul>
      <div class="resumo">
        <span>Total</span>
        <strong id="total" aria-live="polite">R$ 0,00</strong>
      </div>
      <button id="esvaziar" class="botao botao-secundario" type="button">Esvaziar carrinho</button>
    </aside>
  </main>
</body>
</html>
